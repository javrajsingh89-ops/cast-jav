<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cast Jav - Trasmetti Schermo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="dark-theme">
    <div class="container">
        <div class="logo">
            <span class="logo-text">CAST<span class="logo-accent">JAV</span></span>
        </div>

        <div class="status-container">
            <div class="status-card">
                <div class="status-icon" id="status-icon"></div>
                <div class="status-text" id="status-text">In attesa</div>
                <div class="status-subtle" id="status-subtle">Pronto per iniziare</div>
            </div>
        </div>

        <div id="code-container" class="code-container hidden">
            <div class="code-label">CODICE DI CONNESSIONE</div>
            <div class="code-display" id="code-display">----</div>
            <div class="code-hint">Inserisci questo codice sulla TV</div>
            <button id="share-code-btn" class="share-code-btn">
                📋 CONDIVIDI CODICE
            </button>
        </div>

        <button id="share-btn" class="btn-primary btn-large">
            CONDIVIDI SCHERMO
        </button>

        <div id="controls-container" class="controls-container hidden">
            <button id="freeze-btn" class="btn-control">❄️ FREEZE</button>
            <button id="black-btn" class="btn-control">⬛ BLACK</button>
            <button id="blur-btn" class="btn-control">💠 BLUR</button>
            <button id="reset-effect-btn" class="btn-control">⟳ RESET</button>
        </div>

        <button id="end-btn" class="btn-danger hidden">
            TERMINA CAST
        </button>

        <div class="info-text">
            <span>STREAMING SICURO E PRIVATO</span>
            <span>BASSA LATENZA 25-30FPS</span>
            <span>CONTROLLI IN DIRETTA</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
</body>
</html>
